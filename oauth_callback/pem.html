<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Returning to the app...</title>
  </head>
  <body>
    <p>Returning to the app...</p>
    <script>
      // Atlassian sends the user here with ?code=...&state=... in the address.
      // We pass that straight on to the app using its custom scheme.
      // Fill in the same scheme you used for appCallbackScheme in the app.
      var appScheme = "xk7qpz9wm";

      window.location.replace(appScheme + "://callback" + window.location.search);
    </script>
  </body>
</html>
